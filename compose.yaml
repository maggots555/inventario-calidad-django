# SIGMA en Docker.
#
# EXPLICACIÓN PARA PRINCIPIANTES:
# Cada bloque "services" es un programa separado (contenedor) que se
# habla con los demás por el nombre (postgres, redis, web). Solo Nginx
# abre un puerto en tu computadora. La base y Redis se quedan adentro.
#
# Cómo levantarlo (no uses el .env de la laptop: ese es de SQLite):
#   sh docker/levantar.sh
# Ese script crea docker/.env si no existe y llama a:
#   docker compose --env-file docker/.env up -d --build
#
# En el servidor la misma receta vive en /srv/sic/apps/sigma.
# Ahí SIGMA_DATA_ROOT=/srv/sic/data/sigma y el .env lleva secretos reales.

name: sigma

# Tope de los logs que Docker guarda de cada contenedor.
# Sin esto, Gunicorn y Celery pueden llenar el disco del servidor.
# 10 MB por archivo y 3 archivos: cada contenedor se queda en unos 30 MB.
# Los logs de Django siguen en el disco de datos, aparte de este tope.
x-logging: &logs-acotados
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *logs-acotados
    environment:
      POSTGRES_USER: ${DB_USER:-sigma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sigma_local_solo_pruebas}
      POSTGRES_DB: ${DB_NAME:-inventario_mexico}
    volumes:
      - ${SIGMA_DATA_ROOT:-./docker-data}/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-bases-pais.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sigma} -d ${DB_NAME:-inventario_mexico}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sigma_interna

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    logging: *logs-acotados
    # 512 MB alcanzan para la cola, los resultados y la caché.
    # volatile-lru solo borra claves que tienen fecha de caducidad
    # (caché y resultados de Celery). La cola de tareas no tiene caducidad:
    # allkeys-lru podía borrarla cuando la memoria se llenaba y se perdían correos.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - ${SIGMA_DATA_ROOT:-./docker-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - sigma_interna

  web:
    build: .
    image: sigma-web:local
    # pull_policy build: esta imagen se arma aquí. No existe en Docker Hub.
    # Sin esta línea, Compose intenta descargarla y muestra "pull access denied".
    pull_policy: build
    restart: unless-stopped
    logging: *logs-acotados
    env_file:
      - docker/.env
    environment:
      # Estos valores pisan el env_file a propósito: dentro de Docker
      # la base y Redis NO están en localhost, están en los otros servicios.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_ENGINE: django.db.backends.postgresql
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "False"
      SIGMA_MIGRAR: "1"
      # La pantalla de renovación escribe el sello aquí, NO dentro de docker/.env.
      # El cron del host lee el mismo disco: SIGMA_DATA_ROOT/renovacion.
      RENOVACION_ENV_DIR: /app/renovacion
    # Un worker atiende una petición de Django a la vez. sic-sigma tiene 8 núcleos
    # y ~30 GB de RAM: uno por núcleo. Más de eso (el techo teórico es 17) solo
    # haría que los procesos compitan por CPU en dashboards y PDFs.
    # max-requests: cada worker se reemplaza tras ~500 páginas, para soltar
    # la RAM que Python no devuelve (fotos, PDF, gráficas). El jitter reparte
    # ese relevo entre 500 y 600, así no se reinician los 8 al mismo tiempo.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "8", "--max-requests", "500", "--max-requests-jitter", "100", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    volumes:
      - ${SIGMA_DATA_ROOT:-./docker-data}/media:/app/media
      - ${SIGMA_DATA_ROOT:-./docker-data}/staticfiles:/app/staticfiles
      - ${SIGMA_DATA_ROOT:-./docker-data}/logs:/app/logs
      # Hash y fecha de renovación. El cron los lee en el host; Django los escribe aquí.
      - ${SIGMA_DATA_ROOT:-./docker-data}/renovacion:/app/renovacion
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - sigma_interna

  nginx:
    image: nginx:1.28-bookworm
    restart: unless-stopped
    logging: *logs-acotados
    ports:
      - "${SIGMA_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SIGMA_DATA_ROOT:-./docker-data}/media:/app/media:ro
      - ${SIGMA_DATA_ROOT:-./docker-data}/staticfiles:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - sigma_interna

  # Túnel de salida hacia Cloudflare. No abre puertos en el servidor.
  # Solo arranca con: docker compose --profile cloudflare up -d
  # El token vive en docker/.env (CLOUDFLARE_TUNNEL_TOKEN). No va a git.
  # En el panel de Cloudflare el hostname apunta a http://nginx:80
  cloudflared:
    # Versión fija. "latest" cambiaría el túnel el día que alguien haga pull.
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    logging: *logs-acotados
    command: tunnel --no-autoupdate run
    profiles:
      - cloudflare
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_started
    networks:
      - sigma_interna

  celery:
    # Misma imagen que web. build + pull_policy evitan buscarla en internet.
    build: .
    image: sigma-web:local
    pull_policy: build
    restart: unless-stopped
    logging: *logs-acotados
    env_file:
      - docker/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_ENGINE: django.db.backends.postgresql
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "False"
      SIGMA_MIGRAR: "0"
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2", "--max-tasks-per-child=100"]
    # Si el worker arrancó pero no contesta, Docker lo marca unhealthy.
    # El caso del favicon se veía como "Up" un instante y luego Restarting.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    volumes:
      - ${SIGMA_DATA_ROOT:-./docker-data}/media:/app/media
      # La página escribe aquí el manifest de CSS/JS (collectstatic).
      # Con DEBUG=False, Celery también lo lee al arrancar. Sin este
      # disco, busca el favicon dentro de la imagen y se cae.
      - ${SIGMA_DATA_ROOT:-./docker-data}/staticfiles:/app/staticfiles:ro
      - ${SIGMA_DATA_ROOT:-./docker-data}/logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigma_interna

  celery-beat:
    build: .
    image: sigma-web:local
    pull_policy: build
    restart: unless-stopped
    logging: *logs-acotados
    env_file:
      - docker/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_ENGINE: django.db.backends.postgresql
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "False"
      SIGMA_MIGRAR: "0"
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler", "--pidfile", "/tmp/celerybeat.pid"]
    # Beat no contesta el ping del worker. El pidfile dice si el proceso sigue vivo.
    # Python, y no un $() de shell: Compose se come el signo de pesos.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib; pid=int(pathlib.Path('/tmp/celerybeat.pid').read_text()); os.kill(pid, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      # Mismo manifest que el worker. Beat carga las URLs al arrancar.
      - ${SIGMA_DATA_ROOT:-./docker-data}/staticfiles:/app/staticfiles:ro
      - ${SIGMA_DATA_ROOT:-./docker-data}/logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigma_interna

networks:
  sigma_interna:
    name: sigma_interna
