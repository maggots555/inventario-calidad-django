# Nginx dentro de Docker: puerta de entrada de SIGMA.
#
# EXPLICACIÓN PARA PRINCIPIANTES:
# El navegador habla con Nginx. Nginx entrega CSS y JS él mismo
# (rápido). Las fotos pasan primero por Django (ahí se revisa si
# se pueden ver). Lo demás se lo pasa a Gunicorn, que escucha en
# el contenedor "web", puerto 8000, solo dentro de la red de Docker.
# Nadie desde fuera llega directo a Gunicorn ni a PostgreSQL.

# EXPLICACIÓN PARA PRINCIPIANTES:
# Cloudflare pone CF-Connecting-IP y el visitante no puede cambiarla:
# el borde de Cloudflare la pisa. Si esa cabecera no viene (laptop,
# sin túnel), usamos la IP del socket. No copiamos X-Forwarded-For:
# esa lista la escribe quien llama y puede mentir.
map $http_cf_connecting_ip $sigma_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# HTTPS solo cuando el túnel trajo la IP de Cloudflare. En la laptop
# no hay esa cabecera y el esquema es el de Nginx (http en el puerto 80).
# Así un visitante no puede mandar "X-Forwarded-Proto: https" y hacer
# que Django crea que la visita ya iba cifrada.
map $http_cf_connecting_ip $sigma_proto {
    default https;
    ""      $scheme;
}

upstream sigma_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Videos y lotes de fotos. En producción el tope de Nginx es 200 MB.
    client_max_body_size 200m;
    server_tokens off;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Fotos, firmas, comprobantes y CFDIs. El navegador NO puede
    # pedirlos aquí: "internal" responde 404 si la URL llega de fuera.
    # Django, después de revisar la sesión o el token de seguimiento,
    # responde X-Accel-Redirect y Nginx entrega el archivo por dentro.
    location /media-interno/ {
        internal;
        alias /app/media/;
    }

    # /media/ llega a Django (mismo portero de IP que el resto del sitio).
    # Antes Nginx entregaba el disco directo, sin login.
    location /media/ {
        proxy_pass http://sigma_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sigma_real_ip;
        proxy_set_header X-Forwarded-For $sigma_real_ip;
        proxy_set_header X-Forwarded-Proto $sigma_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://sigma_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sigma_real_ip;
        proxy_set_header X-Forwarded-For $sigma_real_ip;
        proxy_set_header X-Forwarded-Proto $sigma_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
