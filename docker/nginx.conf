# Nginx dentro de Docker: puerta de entrada de SIGMA.
#
# EXPLICACIÓN PARA PRINCIPIANTES:
# El navegador habla con Nginx. Nginx entrega CSS, JS y fotos él mismo
# (rápido) y lo demás se lo pasa a Gunicorn (Django), que escucha en
# el contenedor "web", puerto 8000, solo dentro de la red de Docker.
# Nadie desde fuera llega directo a Gunicorn ni a PostgreSQL.

# Si Cloudflare (o el túnel) ya dijo que el usuario vino por HTTPS,
# se lo pasamos a Django. Si entraste directo por el túnel SSH, no hay
# ese dato y se usa el esquema real de Nginx (http).
map $http_x_forwarded_proto $sigma_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream sigma_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Videos y lotes de fotos. En producción el tope de Nginx es 200 MB.
    client_max_body_size 200m;
    server_tokens off;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    location / {
        proxy_pass http://sigma_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sigma_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
